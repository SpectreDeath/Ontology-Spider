[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-spider"
version = "0.1.0"
description = "A standalone ontological engine with Prolog reasoning and Dialog conversational query and elicitation."
readme = "README.md"
authors = [
    { name = "SpectreDeath" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dialog = "ontology_spider.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
