name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install SWI-Prolog (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y swi-prolog swi-prolog-nox swi-prolog-packages || sudo apt-get install -y swi-prolog

    - name: Install SWI-Prolog (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installed = $false
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          Write-Host "Attempt ${attempt}: Installing SWI-Prolog via Chocolatey..."
          choco install swi-prolog -y --no-progress
          if ($LASTEXITCODE -eq 0 -or (Test-Path "C:\Program Files\swipl\bin\swipl.exe")) {
            $installed = $true
            break
          }
          Start-Sleep -Seconds ($attempt * 5)
        }
        if (-not $installed) {
          Write-Host "Chocolatey failed or timed out. Falling back to winget..."
          winget install --id SWI-Prolog.SWI-Prolog -e --silent --accept-source-agreements --accept-package-agreements
        }
        echo "C:\Program Files\swipl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run Tests
      env:
        PYTHONPATH: src
      run: |
        python -m unittest discover -s tests

  degraded-mode:
    name: Degraded Mode (Ubuntu / Python 3.12 / No swipl)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify swipl is absent
      run: |
        which swipl && exit 1 || echo "swipl is absent as expected"

    - name: Run Tests in Degraded Mode
      env:
        PYTHONPATH: src
      run: |
        python -m unittest discover -s tests

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install SWI-Prolog
      run: |
        sudo apt-get update
        sudo apt-get install -y swi-prolog swi-prolog-nox swi-prolog-packages || sudo apt-get install -y swi-prolog

    - name: Install Coverage
      run: |
        python -m pip install --upgrade pip
        pip install coverage

    - name: Run Tests with Coverage
      env:
        PYTHONPATH: src
      run: |
        coverage run --source=src/ontology_spider -m unittest discover -s tests
        coverage report --fail-under=90

  benchmark:
    name: Latency Benchmark & Budgets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install SWI-Prolog
      run: |
        sudo apt-get update
        sudo apt-get install -y swi-prolog swi-prolog-nox swi-prolog-packages || sudo apt-get install -y swi-prolog

    - name: Run Benchmark with Budgets
      env:
        PYTHONPATH: src
      run: |
        python -m ontology_spider.harness bench --budget src/ontology_spider/harness/baselines/bench_budgets.json
