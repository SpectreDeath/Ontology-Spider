name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install SWI-Prolog (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y swi-prolog swi-prolog-nox swi-prolog-packages || sudo apt-get install -y swi-prolog

    - name: Install SWI-Prolog (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install swi-prolog -y --no-progress
        echo "C:\Program Files\swipl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run Tests
      env:
        PYTHONPATH: src
      run: |
        python -m unittest discover -s tests
